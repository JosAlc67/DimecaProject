# MoveItConfigsBuilder's to_moveit_configs() tries to load
# config/pilz_cartesian_limits.yaml by default (even though this project
# does not use the Pilz Industrial Motion Planner / OMPL is the only
# pipeline configured) and raises ParameterBuilderFileNotFoundError if the
# file is missing. Values below are the standard MoveIt Setup Assistant
# placeholder defaults.
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57
